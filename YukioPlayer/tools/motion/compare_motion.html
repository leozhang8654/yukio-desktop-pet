<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>头颈稳定 · 修改前后对比</title>
<style>
body{margin:24px;background:#eef1f5;color:#223047;font:14px system-ui}h1{font-size:23px}button,select,input{font:inherit;padding:6px}header{position:sticky;top:0;background:#eef1f5ee;padding:10px 0;z-index:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}.card{background:white;padding:14px;border-radius:12px}.pair{display:flex;gap:12px;justify-content:center}.pair>div{text-align:center}canvas{width:384px;height:416px;max-width:42vw;object-fit:contain;background:repeating-conic-gradient(#eee 0 25%,white 0 50%) 0 0/16px 16px}h2{font-size:16px}.status{font:12px monospace;min-height:2em}label{margin-right:12px}
</style><h1>头颈稳定 · 修改前后对比</h1><p>左侧为本次修改前的实际 2 倍资源，右侧为重新生成的资源。各自按真实帧时长播放；可单步查看、放大头颈，或跳至循环末尾检查接缝。</p>
<header><label>状态 <select id="state"></select></label><button id="play">暂停</button> <button id="restart">重播开场</button> <button id="seam">循环接缝</button> <button id="step">前进 20 ms</button> <label>速度 <select id="speed"><option value="1">1×</option><option value=".25">0.25×</option></select></label><label><input id="zoom" type="checkbox">放大头颈</label></header><div id="grid" class="grid"></div>
<script>
const items=__ITEMS__, players=[];let running=true,last=0;
for(const item of items){const option=document.createElement('option');option.value=item.id;option.textContent=item.id;state.append(option);}
function choose(){players.length=0;grid.replaceChildren();const item=items.find(it=>it.id===state.value);const card=document.createElement('div');card.className='card';card.innerHTML=`<h2>${item.id}</h2><div class="pair"><div>修改前<br><canvas width="384" height="416"></canvas><div class="status"></div></div><div>修改后<br><canvas width="384" height="416"></canvas><div class="status"></div></div></div>`;grid.append(card);[item.before,item.after].forEach((s,i)=>{const img=new Image();img.src=s.src;img.onload=render;const eye=new Image();if(s.blinkSrc)eye.src=s.blinkSrc;const buffer=document.createElement('canvas');buffer.width=s.frameWidth*(s.pixelScale||1);buffer.height=s.frameHeight*(s.pixelScale||1);players.push({id:item.id,s,img,eye,buffer,ctx:card.querySelectorAll('canvas')[i].getContext('2d'),label:card.querySelectorAll('.status')[i],time:0,seams:0});});render();}
state.value='read_file';state.onchange=choose;

// 与原生 BlinkClock 相同的随机种子、眨眼时长和双眨眼规则。
function blinkLevel(b,now){if(!b)return 0;let rng=b.seed>>>0,start=0,duration=220,second=null;const random=(lo,hi)=>{rng=(Math.imul(1664525,rng)+1013904223)>>>0;return lo+(hi-lo)*rng/4294967296;};const schedule=end=>{start=end+random(2800,7000);duration=random(180,260);second=null;if(random(0,1)<.125)second=[start+duration+random(100,180),random(180,260)];};schedule(0);while(now>=start+duration){if(second){[start,duration]=second;second=null;}else schedule(start+duration);}const u=(now-start)/duration;if(u<=0||u>=1)return 0;const smooth=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x);};return Math.round((u<.36?smooth(u/.36):u<.52?1:1-smooth((u-.52)/.48))*b.levels);}

function render(){for(const p of players){const s=p.s,total=s.durationsMs.reduce((a,b)=>a+b,0),intro=s.durationsMs.slice(0,s.loopStart).reduce((a,b)=>a+b,0);let t=p.time;if(t>=total){p.seams=Math.floor((t-intro)/(total-intro));t=intro+(t-intro)%(total-intro);}let k=0;while(k<s.sequence.length-1&&t>=s.durationsMs[k])t-=s.durationsMs[k++];p.label.textContent=`${k<s.loopStart?'开场':'循环'} · 帧 ${k+1}/${s.sequence.length} · 接缝 ${p.seams}`;if(!p.img.complete||!p.img.naturalWidth)continue;const scale=s.pixelScale||1,w=s.frameWidth*scale,h=s.frameHeight*scale,cols=p.img.width/w,f=s.sequence[k],x=f%cols*w,y=Math.floor(f/cols)*h;const bc=p.buffer.getContext('2d');bc.clearRect(0,0,w,h);bc.drawImage(p.img,x,y,w,h,0,0,w,h);const level=blinkLevel(s.blink,p.time);if(level&&p.eye.complete&&p.eye.naturalWidth){const b=s.blink,patch=b.frames[f][level-1],n=p.eye.width/b.width;bc.clearRect(b.x,b.y,b.width,b.height);bc.drawImage(p.eye,patch%n*b.width,Math.floor(patch/n)*b.height,b.width,b.height,b.x,b.y,b.width,b.height);}p.ctx.clearRect(0,0,384,416);if(zoom.checked){const standing=['idle','failed'].includes(p.id);p.ctx.drawImage(p.buffer,48*scale,(standing?0:14)*scale,96*scale,104*scale,0,0,384,416);}else p.ctx.drawImage(p.buffer,0,0,w,h,0,0,384,416);}}
play.onclick=()=>{running=!running;play.textContent=running?'暂停':'播放';};restart.onclick=()=>{for(const p of players){p.time=0;p.seams=0;}render();};seam.onclick=()=>{for(const p of players){p.time=p.s.durationsMs.reduce((a,b)=>a+b,0)-500;p.seams=0;}render();};step.onclick=()=>{running=false;play.textContent='播放';for(const p of players)p.time+=20;render();};zoom.onchange=render;
function tick(now){if(last&&running)for(const p of players)p.time+=Math.min(now-last,100)*Number(speed.value);last=now;render();requestAnimationFrame(tick);}choose();requestAnimationFrame(tick);
</script></html>
