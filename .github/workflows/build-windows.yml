# 在 GitHub 的 Windows 机器上打出 Yukio.exe，并实跑一遍确认窗口真的画得出来。
# 手动触发（Actions 页面点 Run workflow），或推一个 win-v* 的标签（会顺带建 Release）。
name: 打包 Windows 版雪绪

on:
  workflow_dispatch:
  push:
    tags:
      - "win-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: python -m pip install --upgrade pip pillow pyinstaller

      - name: 自测（72 个核心测试 + 播放器逻辑）
        working-directory: YukioWin
        run: python run.py --selftest

      - name: 素材检查
        working-directory: YukioWin
        run: python run.py --check

      - name: 打包
        working-directory: YukioWin
        run: python -m PyInstaller --noconfirm --clean scripts/yukio.spec

      - name: 实跑一遍（找窗口、量尺寸、截屏）
        working-directory: YukioWin
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-test.ps1 -Exe dist/Yukio.exe

      - name: 留下实跑的截屏与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: YukioWin/smoke/
          if-no-files-found: warn

      - name: 留下 exe
        uses: actions/upload-artifact@v4
        with:
          name: Yukio-Windows
          path: YukioWin/dist/Yukio.exe

      - name: 打 win-v* 标签时顺带发布
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          files: YukioWin/dist/Yukio.exe
          fail_on_unmatched_files: true
